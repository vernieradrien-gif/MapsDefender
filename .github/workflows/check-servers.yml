# Diagnostic : le site publié peut-il joindre Nominatim et les serveurs Overpass
# depuis un navigateur de téléphone ? Résultat dans le résumé de l'exécution.
name: Diagnostic serveurs OSM

on:
  push:
    branches: [ccr-07cc5199-4c4ddk]
    paths: [scripts/check-servers.ts, .github/workflows/check-servers.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Diagnostic
        run: npx tsx scripts/check-servers.ts
