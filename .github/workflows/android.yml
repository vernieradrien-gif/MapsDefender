# Construit l'APK Android de test (Capacitor, publicités de TEST uniquement).
# - Sur une pull request et sur main : l'APK est publié en lien direct (release
#   « apk », toujours le dernier construit) :
#   https://github.com/vernieradrien-gif/MapsDefender/releases/download/apk/streetdefense.apk
#   Il reste aussi dans l'onglet Actions, rubrique « Artifacts » de l'exécution.
# - APK « debug » : signé avec la clé de débogage fixe du dépôt (mises à jour
#   sans désinstaller), pas destiné au Play Store (signature de publication au jalon 6).
name: APK Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # publication de la release « apk »

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Build du site (chemins relatifs pour l'appli)
        run: npm run build

      - name: Copie dans le projet Android
        run: npx cap sync android

      - name: Construction de l'APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: streetdefense-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publication en lien direct (release « apk »)
        # Pas pour une pull request venue d'un fork (jeton en lecture seule).
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE: ${{ github.head_ref || github.ref_name }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk streetdefense.apk
          gh release delete apk --cleanup-tag --yes || true
          gh release create apk streetdefense.apk --prerelease --target "$SHA" \
            --title "StreetDefense — APK de test" \
            --notes "Dernier APK de test construit (branche $SOURCE, commit ${SHA:0:7}). Publicités de test uniquement. Sur le téléphone : ouvrir streetdefense.apk et autoriser l'installation depuis cette source."
