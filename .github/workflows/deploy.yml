# Construit le jeu, lance les tests et publie sur GitHub Pages.
# - Sur une pull request : tests + build seulement (vérification).
# - Sur la branche main (ou lancement manuel) : tests + build + publication.
# Prérequis (une seule fois) : Settings > Pages > Source : « GitHub Actions ».
name: Build et publication GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests unitaires
        run: npm test

      - name: Build (base = /<nom-du-dépôt>/)
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Préparer l'artefact Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
